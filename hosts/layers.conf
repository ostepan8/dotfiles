# hosts/layers.conf — which layers each machine type applies.
#
# The machine's type comes from ~/.dotfiles-host, which already exists and is
# already documented in zsh/zshrc: it holds a machine *type* ("studio",
# "macbook"), not a unique device id, and lives outside the repo so it never
# syncs. The restructure brief proposed adding a second marker file
# (~/.dotrole); this uses the one that is already there instead, because two
# marker files means two things to set per machine and two things that can
# disagree.
#
# Layers COMPOSE — a machine gets the union of every layer listed. The Studio is
# genuinely both a workstation and a server: it runs the lifeos server, three
# WNBA sync jobs and MLX inference while also being the daily driver.
#
# A machine with no ~/.dotfiles-host applies `base` only. That is the safe
# default: a new server node comes up with a working shell, git, tmux and
# Claude, and nothing GUI is ever attempted on a headless box.

# host-type   layers
studio        base workstation services
macbook       base workstation
fedora        base server
gpu1          base server
gpu2          base server
onephus       base server
