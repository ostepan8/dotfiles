# hosts/layers.conf — which layers each machine type applies.
#
# The machine's type comes from ~/.dotfiles-host, which already exists and is
# already documented in zsh/zshrc: it holds a machine *type* ("studio",
# "macbook"), not a unique device id, and lives outside the repo so it never
# syncs. The restructure brief proposed adding a second marker file
# (~/.dotrole); this uses the one that is already there instead, because two
# marker files means two things to set per machine and two things that can
# disagree.
#
# Layers COMPOSE — a machine gets the union of every layer listed. The Studio is
# genuinely both a workstation and a server: it runs the lifeos server, three
# WNBA sync jobs and MLX inference while also being the daily driver.
#
# A machine with no ~/.dotfiles-host applies `base` only. That is the safe
# default: a new server node comes up with a working shell, git, tmux and
# Claude, and nothing GUI is ever attempted on a headless box.

# A layer is just a name. Besides the four role layers there are two other
# useful kinds, and they cost no new machinery:
#
#   host layers    'studio', 'macbook' — for a file only one machine type wants.
#                  Use when something is bigger than a shell snippet (those still
#                  belong in hosts/<type>.zsh).
#
#   tier layers    nephos-keeper / -operator / -node — what this machine is
#                  ALLOWED to do in the personal cloud.
#
# IMPORTANT: tier layers are a DECLARATION, not an enforcement boundary. This
# repo is public and every machine clones the same thing, so nothing here can
# stop a machine that holds a working credential. Enforcement lives at the
# control plane:
#   keeper    holds the master vault; mints and revokes credentials
#   operator  can provision and deploy; holds no long-lived secrets
#   node      runs workloads; its control-plane SSH key is pinned to a single
#             force-command (see scripts/harden-node-key.sh)

# host-type   layers
studio        base workstation services studio        nephos-keeper
macbook       base workstation           macbook      nephos-operator
fedora        base server                             nephos-node
gpu1          base server                             nephos-node
gpu2          base server                             nephos-node
onephus       base server                             nephos-node
