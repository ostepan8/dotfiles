# studio-ports.conf: the ports `s <session>` opens on the MacBook by itself.
#
# Columns: tmux-session  port...
# Session names match in any case. A Subconscious ticket needs no line here, because
# `s` reads the ticket's own ports from <ticket>/.sub/ports on the Studio.
# Add a line for any project with a server you want to reach in the MacBook browser.
# Give each project its own port, from 4100 upward. See the studio-dev skill.

listhalo    5173 3001 8081
