# fleet.conf — ssh alias -> host type, for scripts/fleet.sh.
#
# The alias is what `ssh <name>` resolves via ~/.ssh/config; the type is the key
# into hosts/layers.conf. They are usually the same, but not always: the Pi
# answers to `pi` and is the `onephus` host type.
#
# Only names appear here — no addresses, no domains. The addresses live in
# ~/.ssh/config and ~/.config/nephos/env, both untracked, because this repo is
# public. Host types are already listed in hosts/layers.conf, so this adds no
# information that was not already there.
#
# The machine you are running from is not listed: fleet.sh never tries to update
# itself over ssh.

# Columns: ssh-alias  host-type  tailscale-name  remote-user
#
# tailscale-name is the MagicDNS SHORT name — it resolves on-tailnet without the
# tailnet suffix, so no tailnet identifier is recorded here. Nothing in this file
# is a secret: no addresses, no keys, no domain. It is the mapping that lets a
# rebuilt machine regenerate ~/.ssh/config for the fleet (setup.d/30-ssh-hosts.sh)
# instead of that knowledge living only in one untracked file on one Mac.

# ssh-alias   host-type   tailscale-name        remote-user
macbook       macbook     owens-macbook-pro-2   ostepan
fedora        fedora      fedora                ostepan8
gpu1          gpu1        gpu1                  ostepan
gpu2          gpu2        gpu2                  ostepan
pi            onephus     nephos-pi             ostepan
