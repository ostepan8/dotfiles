# manifest.conf — the single source of truth for "which file goes where".
#
# Replaces the three hand-rolled copy lists in mac/setup.sh, mac/apply.sh and
# linux/setup.sh, which had silently drifted apart (see docs/RESTRUCTURE-PLAN.md).
#
# Columns:  layer  mode  source  dest  reload
#
#   layer   base | workstation | server | services
#           Layers COMPOSE. A machine applies every row whose layer is in its
#           list (hosts/layers.conf). The Studio is base+workstation+services.
#
#   mode    link    symlink source -> dest. The default. Edits on either side
#                   stay in sync, and apply can never silently clobber a hand
#                   edit the way `cp -f` did.
#           copy    copy source -> dest, but ONLY when the source's hash has
#                   moved. For a file that is tracked AND rewritten at runtime:
#                   a symlink would aim those runtime writes at the git repo,
#                   and the hash gate stops an idle apply from reverting them.
#           seed    copy ONLY if dest is absent, then never touch it again.
#                   For per-machine values that must survive every apply.
#           render  run lib/render/<name>.sh to generate dest from source.
#                   For templates with machine-computed values.
#           tree    recursive sync of a directory.
#           agent   install a launchd plist and reload it if it changed.
#           exec    make dest an executable symlink onto PATH.
#
#   source  path relative to the repo root. May end in a glob (aerospace/*.sh),
#           in which case dest must end in '/'.
#
#   dest    absolute path; '~' expands to $HOME.
#
#   reload  tag from lib/reloads.sh, fired once per apply when any source
#           carrying that tag actually changed. '-' for none.
#
# NOTE: sources are still at their PRE-restructure paths. Phase 3 moves files
# and edits ONLY this column, so the move is provably behavior-neutral.

# ---------------------------------------------------------------------------
# base — every machine, no exceptions
# ---------------------------------------------------------------------------
base         link    zsh/zshrc                       ~/.zshrc                                    -
base         link    zsh/zsh_plugins.txt             ~/.zsh_plugins.txt                          -
base         link    git/gitconfig                   ~/.gitconfig                                -
base         link    git/gitignore_global            ~/.gitignore_global                         -
base         link    tmux/.tmux.conf                 ~/.tmux.conf                                tmux
base         link    starship/starship.toml          ~/.config/starship.toml                     -
base         link    nvim/init.lua                   ~/.config/nvim/init.lua                     -

# Claude — the personal profile is the one `claude` actually reads on every
# machine (zsh/zshrc exports CLAUDE_CONFIG_DIR=~/.claude-personal), so it is
# base. Until now apply.sh wrote to ~/.claude instead — a directory nothing
# reads — and never copied skills at all, while linux/setup.sh installed none
# of it. Profiles are listed one row each: dumb, greppable, no logic here.
base         link    claude/settings.json            ~/.claude-personal/settings.json            -
base         link    claude/mcp.json                 ~/.claude-personal/.mcp.json                -
base         tree    claude/rules                    ~/.claude-personal/rules                    -
base         tree    claude/skills                   ~/.claude-personal/skills                   -

# Skills that also ship a terminal CLI.
base         exec    claude/skills/youtube-transcribe/scripts/transcribe.py          ~/.local/bin/yt-transcribe          -
base         exec    claude/skills/youtube-transcribe/scripts/transcribe_channel.py  ~/.local/bin/yt-transcribe-channel  -
base         exec    claude/skills/new-project/scripts/newproj.sh                    ~/.local/bin/newproj                -
base         exec    claude/skills/new-project/scripts/newproj.sh                    ~/.local/bin/np                     -

# ---------------------------------------------------------------------------
# workstation — a human is sitting in front of it
# ---------------------------------------------------------------------------
workstation  link    ghostty/config                  ~/.config/ghostty/config                    -
workstation  link    skhd/skhdrc                     ~/.skhdrc                                   skhd
workstation  link    sketchybar/sketchybarrc         ~/.config/sketchybar/sketchybarrc           sketchybar
workstation  link    sketchybar/plugins/*.sh         ~/.config/sketchybar/plugins/               sketchybar

# aerospace.toml is BOTH tracked AND rewritten at runtime by set-main-display.sh,
# which stamps this machine's monitor pins into it. Symlinking it would point
# those writes at the git repo: permanently dirty tree, and sync.sh's rebase/push
# loop would make the two Macs overwrite each other's display layout every 30 min.
# `copy` (not `seed`): an upstream edit must still reach the machine, and the
# reload re-stamps this machine's pins afterwards. The hash gate is what stops an
# idle apply from reverting the live pins on every tick.
workstation  copy    aerospace/aerospace.toml        ~/.config/aerospace/aerospace.toml          aerospace
workstation  seed    aerospace/displays.env          ~/.config/aerospace/displays.env            -
workstation  link    aerospace/*.sh                  ~/.config/aerospace/                        -
workstation  render  aerospace/list-real-windows.swift  ~/.config/aerospace/list-real-windows    -

# clangd config is a template: __GCXX__/__GTRIPLE__ are filled from the installed
# Homebrew GCC, and it lands in the macOS-specific location, not ~/.config.
workstation  render  clangd/config.yaml              ~/Library/Preferences/clangd/config.yaml    -

# Window-manager infrastructure agents.
workstation  agent   mac/LaunchAgents/com.ostepan.aerospace-cleanup.plist   ~/Library/LaunchAgents/  -
workstation  agent   mac/LaunchAgents/com.ostepan.display-watcher.plist     ~/Library/LaunchAgents/  -
workstation  agent   mac/LaunchAgents/com.ostepan.dotfiles-sync.plist       ~/Library/LaunchAgents/  -

# Extra Claude profiles — school/work accounts are workstation-only.
workstation  link    claude/settings.json            ~/.claude-school/settings.json              -
workstation  link    claude/mcp.json                 ~/.claude-school/.mcp.json                  -
workstation  tree    claude/rules                    ~/.claude-school/rules                      -
workstation  tree    claude/skills                   ~/.claude-school/skills                     -
workstation  link    claude/settings.json            ~/.claude-work/settings.json                -
workstation  link    claude/mcp.json                 ~/.claude-work/.mcp.json                    -
workstation  tree    claude/rules                    ~/.claude-work/rules                        -
workstation  tree    claude/skills                   ~/.claude-work/skills                       -

# ---------------------------------------------------------------------------
# services — opt-in background jobs. Deployment, not configuration.
# ---------------------------------------------------------------------------
services     agent   mac/LaunchAgents/com.ostepan.lifeos.server.plist                    ~/Library/LaunchAgents/  -
services     agent   mac/LaunchAgents/com.ostepan.lifeos.nudge-morning.plist             ~/Library/LaunchAgents/  -
services     agent   mac/LaunchAgents/com.ostepan.lifeos.nudge-evening.plist             ~/Library/LaunchAgents/  -
services     agent   mac/LaunchAgents/com.ostepan.wnba-espn-sync.plist                   ~/Library/LaunchAgents/  -
services     agent   mac/LaunchAgents/com.ostepan.wnba-balldontlie-season-sync.plist     ~/Library/LaunchAgents/  -
services     agent   mac/LaunchAgents/com.ostepan.wnba-market-and-injury-snapshot.plist  ~/Library/LaunchAgents/  -
