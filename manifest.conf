# manifest.conf — the single source of truth for "which file goes where".
#
# Replaces the three hand-rolled copy lists in mac/setup.sh, mac/apply.sh and
# linux/setup.sh, which had silently drifted apart (see docs/RESTRUCTURE-PLAN.md).
#
# Columns:  layer  mode  source  dest  reload
#
#   layer   base | workstation | server | services
#           Layers COMPOSE. A machine applies every row whose layer is in its
#           list (hosts/layers.conf). The Studio is base+workstation+services.
#
#   mode    link    symlink source -> dest. The default. Edits on either side
#                   stay in sync, and apply can never silently clobber a hand
#                   edit the way `cp -f` did.
#           copy    copy source -> dest, but ONLY when the source's hash has
#                   moved. For a file that is tracked AND rewritten at runtime:
#                   a symlink would aim those runtime writes at the git repo,
#                   and the hash gate stops an idle apply from reverting them.
#           seed    copy ONLY if dest is absent, then never touch it again.
#                   For per-machine values that must survive every apply.
#           render  run lib/render/<name>.sh to generate dest from source.
#                   For templates with machine-computed values.
#           tree    recursive sync of a directory.
#           agent   install a launchd plist and reload it if it changed.
#           exec    like link, and assert the exec bit on the repo source. Use
#                   for anything ANOTHER program executes — a $PATH entry, a
#                   launchd ProgramArguments target, a sketchybar plugin. A
#                   plain `link` row leaves the bit to whatever the file
#                   happened to be committed with: lose it and the caller
#                   fails with a bare exit 126 nothing surfaces.
#
#   source  path relative to the repo root. May end in a glob (aerospace/*.sh),
#           in which case dest must end in '/'.
#
#   dest    absolute path; '~' expands to $HOME.
#
#   reload  tag from lib/reloads.sh, fired once per apply when any source
#           carrying that tag actually changed. '-' for none.
#
# Sources sit in their layer directories. The move (phase 3) changed ONLY the
# source column — scripts/verify-apply.sh passed identically before and after,
# which is what makes the restructure provably behavior-neutral.

# ---------------------------------------------------------------------------
# base — every machine, no exceptions
# ---------------------------------------------------------------------------
base         link    base/zsh/zshrc                       ~/.zshrc                                    -
base         link    base/zsh/zsh_plugins.txt             ~/.zsh_plugins.txt                          -
base         link    base/git/gitconfig                   ~/.gitconfig                                -
base         link    base/git/gitignore_global            ~/.gitignore_global                         -
base         link    base/tmux/.tmux.conf                 ~/.tmux.conf                                tmux
base         link    base/starship/starship.toml          ~/.config/starship.toml                     -
base         link    base/nvim/init.lua                   ~/.config/nvim/init.lua                     -
# The pdfview module (nvim reads PDFs: text extraction + page images). `link`,
# matching init.lua above: `tree` copies, which would send every live edit under
# ~/.config/nvim/lua/pdfview into a copy the repo never sees — the exact drift
# that made init.lua a link in the first place. A glob rather than one row per
# file, so adding a module file needs no new manifest row.
base         link    base/nvim/lua/pdfview/*.lua          ~/.config/nvim/lua/pdfview/                 -
# The lockfile, never the plugin sources. `:Lazy restore` pins any machine to
# this exact set; without it committed, every machine resolved plugin versions
# independently on first launch and drifted. `link` on purpose: `:Lazy sync`
# writes through to the repo, so a version bump shows up as a reviewable diff
# instead of vanishing. Unlike aerospace.toml, divergence here is NOT legitimate
# — every machine should be on the same set, so a conflict is worth surfacing.
# Workstations LINK it: you update plugins there on purpose, and writing through
# to the repo turns a version bump into a reviewable diff.
#
# Servers COPY it. A worker node must never be the source of plugin-version
# truth, and with a symlink it becomes one — any :Lazy operation there rewrites
# the fleet's lockfile in place. fedora did exactly that and then had a dirty
# tree, which blocked its own updates. `copy` is hash-gated, so the node still
# receives new pins from the repo while its local churn stays local.
workstation  link    base/nvim/lazy-lock.json             ~/.config/nvim/lazy-lock.json               -
server       copy    base/nvim/lazy-lock.json             ~/.config/nvim/lazy-lock.json               -

# Claude — the personal profile is the one `claude` actually reads on every
# machine (zsh/zshrc exports CLAUDE_CONFIG_DIR=~/.claude-personal), so it is
# base. Until now apply.sh wrote to ~/.claude instead — a directory nothing
# reads — and never copied skills at all, while linux/setup.sh installed none
# of it. Profiles are listed one row each: dumb, greppable, no logic here.
# Skills live in ONE place: base/agents/skills. Both tools reach them through
# symlink farms (base/claude/skills, base/codex/skills) whose link text is
# relative and resolves at the DESTINATION — ~/.claude-personal/skills/X and
# ~/.codex/skills/X are both two levels under $HOME, so ../../.agents/skills/X
# lands correctly. Those links deliberately do NOT resolve inside the repo.
#
# This row is what makes them resolve at all: without ~/.agents/skills on disk,
# every farm entry points at a directory that was never created. That was the
# state before Codex was added — 43 skills existed only on this machine and no
# fresh install could reproduce them.
base         tree    base/agents/skills                   ~/.agents/skills                            -
base         link    base/agents/.skill-lock.json         ~/.agents/.skill-lock.json                  -
# The yeelight skill needs this household's actual bulb addresses, which are
# machine-specific and blocked by scripts/check-secrets.sh. `seed`: written once
# if absent, never touched again, so the tracked template can never clobber a
# populated list.
base         seed    base/agents/skills/yeelight/references/bulbs.txt.template  ~/.agents/skills/yeelight/references/bulbs.txt  -

base         link    base/claude/settings.json            ~/.claude-personal/settings.json            -
base         link    base/claude/mcp.json                 ~/.claude-personal/.mcp.json                -
base         tree    base/claude/rules                    ~/.claude-personal/rules                    -
base         tree    base/claude/skills                   ~/.claude-personal/skills                   -

# Codex — same shape as Claude above. config.toml is `copy`, not `link`: codex
# rewrites it at runtime (auth state, model catalog), and a symlink would aim
# those writes at the git repo. The hash gate still delivers upstream edits.
# AGENTS.md is generated from base/claude/rules by base/codex/gen-agents-md.sh,
# so one set of rules feeds both tools.
base         copy    base/codex/config.toml               ~/.codex/config.toml                        -
base         link    base/codex/AGENTS.md                 ~/.codex/AGENTS.md                          -
# hooks.json is deliberately NOT installed. It wires PreCompact/PostCompact to
# subconscious-hook.sh, which reports every compaction to the Subconscious API
# — unwanted when Codex runs on the ChatGPT subscription. Both files stay
# tracked so re-enabling is uncommenting one row, not rewriting them.
# base       link    base/codex/hooks.json                ~/.codex/hooks.json                         -
# base       exec    base/codex/subconscious-hook.sh      ~/.codex/subconscious-hook.sh               -
base         tree    base/codex/skills                    ~/.codex/skills                             -
# A SECOND codex home, used only by cxl for local/offline runs. Its whole value
# is the MCP servers it omits: the cloud config's blender server adds 18 tool
# definitions to every prompt, and a local model re-pays every system-prompt
# token on every turn (no server-side caching). Skills are shared with it, so
# offline work keeps the same skill set.
# Skills reach the OFFLINE Claude profile too, so both harnesses have the same
# 56 available with no network. claude-local keeps ~/.claude-local free of MCP
# servers, plugins and personal rules because a local model re-pays every
# system-prompt token each turn — skills were measured before being added
# here: 3124 input tokens with none, 3398 with all 56. +274 (0.4% of a 65536
# window) buys nephos, roku, system-rescue and the rest on a plane.
base         tree    base/claude/skills                   ~/.claude-local/skills                      -
base         copy    base/codex/local-config.toml         ~/.codex-local/config.toml                  -
base         tree    base/codex/skills                    ~/.codex-local/skills                       -

# Skills that also ship a terminal CLI.
base         exec    base/agents/skills/youtube-transcribe/scripts/transcribe.py          ~/.local/bin/yt-transcribe          -
base         exec    base/agents/skills/youtube-transcribe/scripts/transcribe_channel.py  ~/.local/bin/yt-transcribe-channel  -
base         exec    base/agents/skills/new-project/scripts/newproj.sh                    ~/.local/bin/newproj                -
base         exec    base/agents/skills/new-project/scripts/newproj.sh                    ~/.local/bin/np                     -

# Claude Code against a locally-served model. base rather than workstation:
# defining the commands costs nothing on a machine that never runs Ollama, and
# either Mac may end up serving the model.
# One command to answer 'will agents work with no network?' before boarding.
# Every failing check prints the command that fixes it, because you cannot
# look anything up once you are offline.
base         exec    base/agents/bin/agents-doctor                                        ~/.local/bin/agents-doctor          -
base         exec    base/claude/bin/claude-local                                         ~/.local/bin/claude-local           -
base         exec    base/claude/bin/claude-local-setup                                   ~/.local/bin/claude-local-setup     -

# ---------------------------------------------------------------------------
# workstation — a human is sitting in front of it
# ---------------------------------------------------------------------------
# Natural-language file finder, built on macOS Spotlight (mdfind), with a
# `find`-based fallback for dotfiles/unindexed paths. workstation rather than
# base: mdfind doesn't exist on the headless Linux fleet members.
workstation  exec    base/bin/ff                                 ~/.local/bin/ff                             -

workstation  link    workstation/ghostty/config                  ~/.config/ghostty/config                    -
workstation  link    workstation/skhd/skhdrc                     ~/.skhdrc                                   skhd
workstation  exec    workstation/skhd/chrome-profile.sh          ~/.config/skhd/chrome-profile.sh            -
workstation  link    workstation/sketchybar/sketchybarrc         ~/.config/sketchybar/sketchybarrc           sketchybar
workstation  exec    workstation/sketchybar/plugins/*.sh         ~/.config/sketchybar/plugins/               sketchybar

# aerospace.toml is BOTH tracked AND rewritten at runtime by set-main-display.sh,
# which stamps this machine's monitor pins into it. Symlinking it would point
# those writes at the git repo: permanently dirty tree, and sync.sh's rebase/push
# loop would make the two Macs overwrite each other's display layout every 30 min.
# `copy` (not `seed`): an upstream edit must still reach the machine, and the
# reload re-stamps this machine's pins afterwards. The hash gate is what stops an
# idle apply from reverting the live pins on every tick.
workstation  copy    workstation/aerospace/aerospace.toml        ~/.config/aerospace/aerospace.toml          aerospace
workstation  seed    workstation/aerospace/displays.env          ~/.config/aerospace/displays.env            -
workstation  exec    workstation/aerospace/*.sh                  ~/.config/aerospace/                        -
workstation  render  workstation/aerospace/list-real-windows.swift  ~/.config/aerospace/list-real-windows    -

# clangd config is a template: __GCXX__/__GTRIPLE__ are filled from the installed
# Homebrew GCC, and it lands in the macOS-specific location, not ~/.config.
workstation  render  workstation/clangd/config.yaml              ~/Library/Preferences/clangd/config.yaml    -

# Window-manager infrastructure agents.
workstation  agent   workstation/aerospace/agents/com.ostepan.aerospace-cleanup.plist   ~/Library/LaunchAgents/  -
workstation  agent   workstation/aerospace/agents/com.ostepan.display-watcher.plist     ~/Library/LaunchAgents/  -
workstation  agent   lib/agents/com.ostepan.dotfiles-sync.plist       ~/Library/LaunchAgents/  -

# Extra Claude profiles — school/work accounts are workstation-only.
workstation  link    base/claude/settings.json            ~/.claude-school/settings.json              -
workstation  link    base/claude/mcp.json                 ~/.claude-school/.mcp.json                  -
workstation  tree    base/claude/rules                    ~/.claude-school/rules                      -
workstation  tree    base/claude/skills                   ~/.claude-school/skills                     -
workstation  link    base/claude/settings.json            ~/.claude-work/settings.json                -
workstation  link    base/claude/mcp.json                 ~/.claude-work/.mcp.json                    -
workstation  tree    base/claude/rules                    ~/.claude-work/rules                        -
workstation  tree    base/claude/skills                   ~/.claude-work/skills                       -

# ---------------------------------------------------------------------------
# nephos tiers — see hosts/layers.conf. The CLI wrapper goes to every member so
# `nephos` behaves identically everywhere, including from cron and launchd where
# no rc file is read. It refuses cleanly if the binary is not installed, so a
# machine that is a member on paper but not yet provisioned fails legibly.
# ---------------------------------------------------------------------------
nephos-keeper    exec  base/nephos/nephos   ~/.local/bin/nephos   -
nephos-operator  exec  base/nephos/nephos   ~/.local/bin/nephos   -
nephos-node      exec  base/nephos/nephos   ~/.local/bin/nephos   -

# The control-room ("keeper") machine additionally gets the nephos-admin skill —
# how to OPERATE the cloud (build/ship the binary, control plane, nodes, tiers).
# Every machine already gets the base `nephos` skill (use the cloud) via the base
# layer; only a keeper gets the admin surface, so an operator's agent never sees
# (and can't be misled into) control-plane actions it can't perform. tree is
# additive, so this lands alongside the base skills without disturbing them.
nephos-keeper    tree  base/claude/keeper-skills/nephos-admin   ~/.claude-personal/skills/nephos-admin   -

# ---------------------------------------------------------------------------
# services — opt-in background jobs. Deployment, not configuration.
# ---------------------------------------------------------------------------
services     agent   services/lifeos/com.ostepan.lifeos.server.plist                    ~/Library/LaunchAgents/  -
services     agent   services/lifeos/com.ostepan.lifeos.nudge-morning.plist             ~/Library/LaunchAgents/  -
services     agent   services/lifeos/com.ostepan.lifeos.nudge-evening.plist             ~/Library/LaunchAgents/  -
services     agent   services/wnba/com.ostepan.wnba-espn-sync.plist                   ~/Library/LaunchAgents/  -
services     agent   services/wnba/com.ostepan.wnba-balldontlie-season-sync.plist     ~/Library/LaunchAgents/  -
services     agent   services/wnba/com.ostepan.wnba-market-and-injury-snapshot.plist  ~/Library/LaunchAgents/  -

# nephos inference host (Studio): the DFlash `big` tier + the memory watchdog that
# sheds inference load before macOS swaps itself to death. Studio-only via the
# `services` layer. Reproduce the mlx-dspark stack with services/nephos/setup-dflash.sh.
services  agent  services/nephos/com.nephos.memguard.plist  ~/Library/LaunchAgents/  -
services  agent  services/nephos/com.nephos.llm.big.plist   ~/Library/LaunchAgents/  -
services  exec   services/nephos/nephos-memguard            ~/.local/bin/nephos-memguard  -
