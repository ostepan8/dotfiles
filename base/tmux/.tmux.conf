# ============================
# TMUX MODERN CONFIG
# ============================

# ============================
# GENERAL SETTINGS
# ============================
# Better prefix key (Ctrl-a)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# tmux-256color advertises italics + 24-bit color over screen-256color.
# Falls back gracefully if the host terminfo doesn't have it.
set -g default-terminal "tmux-256color"

# -gu first, THEN -ga. These are append options, so without the reset every
# `prefix + r` stacks another copy onto the list -- reloading a few times in a
# sitting had already pushed *:RGB to eight identical entries. -gu restores the
# built-in defaults (xterm*:clipboard:ccolour:cstyle:focus:title and friends),
# which a plain -g would instead wipe out, and the appends below rebuild from
# there. Net effect: sourcing this file twice is the same as sourcing it once.
set -gu terminal-features
set -gu terminal-overrides

# Truecolor. Replaces an earlier ",*256col*:Tc" override that never once fired:
# terminal-overrides matches the OUTER terminal's TERM, which here is
# xterm-ghostty, and that does not glob to *256col*. *:RGB covers every
# terminal, so the narrower line was dead weight on top of being wrong.
set -ga terminal-features ",*:RGB"

# Undercurl + colored underlines. Without this nvim's LSP diagnostics arrive as
# flat, uncolored underlines: tmux-256color's terminfo carries neither Smulx nor
# Setulc, so tmux drops the sequences on the floor. Ghostty's own terminfo does
# advertise both, so declaring the feature is all that is needed -- tmux then
# passes them through rather than swallowing them.
set -ga terminal-features ",*:usstyle"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1


# Make sure the buffer matched macs
set -g set-clipboard on


# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Enable mouse support
set -g mouse on

# Faster command sequences (no delay after escape key)
set -sg escape-time 0

# Display messages for 4 seconds
set -g display-time 4000

# Focus events enabled for terminals that support them
set -g focus-events on

# Let a pane emit raw terminal escape sequences straight through tmux. Required
# for nvim to draw images (Kitty graphics protocol) inside tmux — without it,
# `gi` in a PDF buffer renders nothing at all and reports no error, because tmux
# swallows the escape sequence silently. -gq so tmux versions without the option
# do not fail the whole config.
set -gq allow-passthrough on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Silence bells
set -g visual-bell off
set -g bell-action none

# ============================
# KEY BINDINGS
# ============================
# Set vi mode for copy mode
setw -g mode-keys vi

# Copy mode improvements (cross-platform clipboard)
bind-key -T copy-mode-vi 'v' send -X begin-selection
if-shell "uname | grep -q Darwin" \
    "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
    "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

# Better splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window with current path
bind c new-window -c "#{pane_current_path}"

# Pane switching with Vim-split awareness (C-h/C-j/C-k/C-l) is NOT bound here.
# It used to be, with a hand-copied is_vim check -- but vim-tmux-navigator binds
# the same four keys, `run tpm` is the last line of this file, and last write
# wins, so those bindings never once took effect. Worse, the copy had drifted:
# the plugin's current matcher also handles `-wrapped` suffixes and dot-prefixed
# binaries that the local copy missed. Deleted rather than re-synced; the plugin
# owns these keys.

# Alternative: Use Alt + vim keys for pane navigation (no conflicts)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resizing with Prefix + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation. C-h/C-l live at the BOTTOM of this file, after tpm --
# see the post-plugin overrides section for why.
bind Tab last-window

# Direct window access with Alt+number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Shift+arrow for prev/next window (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# Quick reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Toggle synchronize panes (useful for running same command on multiple servers)
bind S setw synchronize-panes

# ============================
# LINKS & URLS
# ============================
# Why cmd+click alone does nothing in here: `mouse on` above puts tmux into
# mouse-reporting mode, and Ghostty disables its own link detection entirely
# while the running program is claiming the mouse. Holding shift is the escape
# hatch -- Ghostty's mouse-shift-capture defaults to false, meaning shift is NOT
# forwarded to tmux, so the terminal gets the click back and opens the link.
#
#   cmd+shift+click    open a link Ghostty can see on screen
#   prefix + u         fzf-pick a URL from the pane (tmux-fzf-url), ctrl-y copies
#   o / C-o in copy mode   open the selection (tmux-open)
#
# Prefer prefix+u for anything long: cmd+shift+click can only match what fits on
# one physical line, so a URL tmux wrapped opens truncated or not at all.

# ============================
# STATUS BAR
# ============================
# Status bar refresh rate
set -g status-interval 5

# Status bar colors
set -g status-style bg=colour235,fg=colour136
set -g status-left-length 50
set -g status-right-length 100

# Left side: session, window, pane
set -g status-left '#[fg=colour166,bold] ❐ #S #[fg=colour33]⎥ #[fg=colour136]#I:#P '

# Right side: system info
set -g status-right '#[fg=colour33]#(whoami)@#H #[fg=colour166]⎥ #[fg=colour64]%a %Y-%m-%d #[fg=colour136]%H:%M '

# Window status
setw -g window-status-format '#[fg=colour244,bg=colour235] #I: #W#F '
setw -g window-status-current-format '#[fg=colour166,bg=colour239,bold] #I: #W#F '

# Pane borders
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour166

# Message style
set -g message-style bg=colour235,fg=colour166
set -g message-command-style bg=colour235,fg=colour166

# ============================
# TMUX PLUGIN MANAGER (TPM)
# ============================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'

# URL/link handling — see the "LINKS & URLS" notes above the keybinds.
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-open'

# Plugin configurations
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @prefix_highlight_show_copy_mode 'on'

# Without these two, a restore hands back panes in the right shape with nothing
# running in them. strategy-nvim reopens nvim with -S Session.vim when the pane's
# cwd has one (harmless where it does not), and @resurrect-processes extends the
# default whitelist -- resurrect refuses to restore anything not named here, so
# an unlisted ssh or tail comes back as a bare shell. Deliberately NOT ':all:',
# which would also relaunch whatever agent or dev server was running at save.
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh psql mysql sqlite3 "tail -f" less man'

# prefix + u: fuzzy-pick any URL on screen and open it. -J-joined capture, so a
# URL tmux wrapped across two lines still comes out whole -- which is exactly
# the case cmd+click can never handle.
#
# Newest first. capture-pane emits screen order, oldest at the top, so --tac
# flips it and --reverse puts that under the prompt rather than above it. Both
# of those only fix the INITIAL order: fzf re-ranks by match score the moment
# you type, which drags whichever URL happens to fuzzy-match best to the top
# regardless of age. --no-sort is what actually holds recency while filtering.
# Verified: searching "gh" over a recent long URL and an ancient "https://gh",
# the recent one stays on top only with --no-sort.
#
# The nl numbers count DOWN from the top as a result -- higher number = more
# recent, which is the intended reading.
set -g @fzf-url-history-limit '5000'
set -g @fzf-url-fzf-options '\-w 70% -h 40% --multi --tac --no-sort --reverse --prompt="open > "'

# In copy mode: o opens the selection with `open`, C-o opens it in $EDITOR.
set -g @open-S 'https://duckduckgo.com/?q='

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# ============================
# POST-PLUGIN OVERRIDES
# ============================
# Everything below runs AFTER tpm, and has to. tmux keeps one binding per key
# and the last writer wins, so anything a plugin binds beats an identical line
# earlier in this file -- silently, with no warning and nothing in list-keys to
# suggest the config ever asked for something else.
#
# That is what happened to prefix+C-l: vim-tmux-navigator rebinds it to
# send-keys C-l (its way of handing back clear-screen, since it claims bare C-l
# for pane movement), which quietly overwrote next-window. prefix+C-h was left
# alone and kept working, so the pair ended up half-functional -- C-h changed
# window, C-l cleared the screen.
bind -r C-h previous-window
bind -r C-l next-window

# ...which leaves clear-screen homeless, because bare C-l belongs to the
# navigator. It lives here now.
bind C-k send-keys C-l

# Popups (tmux 3.2+, and none were bound). -E closes the popup when the command
# exits; -d starts it in the active pane's directory rather than $HOME.
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind P display-popup -E -d "#{pane_current_path}" -w 80% -h 75%

# A popup bound to a NAMED session rather than a throwaway shell. -A attaches if
# "scratch" exists and creates it otherwise, so the same shell -- and whatever is
# still running in it -- is one keystroke away from any of the other sessions.
# Root-table binding on purpose: a scratchpad you need the prefix for is not a
# scratchpad.
bind -n M-g display-popup -E -w 80% -h 70% "tmux new-session -A -s scratch"

# prefix + T: jump to any session, running or not. choose-tree is a tree you
# arrow through, which stops scaling somewhere well below the 28 sessions open
# here. sesh merges live tmux sessions with zoxide's directory history into one
# fuzzy list and attaches-or-creates on pick, so a project that is not currently
# running is reached the same way as one that is -- no separate `ta` vs newproj
# decision. -d drops duplicates where a session and its zoxide entry collide;
# -H hides the session already attached, which is never the one being asked for.
# No --icons: it prefixes a glyph that sesh then has to strip back off on connect,
# and that round trip cannot be tested without switching the attached client.
# Cosmetic gain, unverified dependency -- left off.
bind T display-popup -E -w 60% -h 60% 'sesh connect "$(sesh list -tzd -H | fzf --no-sort --ansi --reverse --prompt="sesh > ")"'
